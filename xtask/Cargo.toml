[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# Bootstrap independently: the root crate's patched sources are prepared by xtask.
[workspace]

[dependencies]
flate2 = "1"
regex = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = { version = "0.8", default-features = false, features = ["parse"] }
