[package]
name = "zakura-network-bindings"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
build = "wallet-host/build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["viewing", "birthday", "standalone-pczt"]
standalone-pczt = ["dep:pczt", "dep:postcard", "pczt/transparent", "pczt/sapling", "dep:zcash_script", "dep:zcash_transparent", "dep:serde_json"]
birthday = ["dep:getrandom", "dep:zcash_client_backend", "zcash_client_backend/orchard", "dep:prost", "dep:serde_json", "dep:hex"]
viewing = ["dep:zcash_keys", "zcash_keys/sapling", "zcash_keys/orchard", "zcash_keys/transparent-inputs", "dep:zcash_address", "dep:zcash_transparent", "dep:zip32", "dep:serde_json", "dep:hex"]
wallet-threaded = ["wallet-storage", "dep:rayon"]
wallet-storage = ["dep:incrementalmerkletree", "dep:time", "dep:secp256k1", "zcash_script/signature-validation","zcash_client_sqlite/serde","zcash_client_backend/pczt", "dep:zcash_note_encryption","dep:sha2","standalone-pczt", "dep:bip39", "dep:secrecy", "dep:rusqlite", "dep:zcash_client_sqlite", "dep:rand_core", "dep:getrandom", "dep:uuid", "dep:pczt", "pczt/io-finalizer", "pczt/signer", "dep:sapling", "dep:orchard", "dep:zcash_client_backend", "dep:zcash_keys", "dep:prost", "dep:zip32", "dep:serde_json", "dep:hex", "dep:zcash_address", "dep:zcash_transparent"]

[[test]]
name = "wallet_native"
required-features = ["wallet-storage"]

[dependencies]
rayon = { version = "=1.12.0", optional = true }
incrementalmerkletree = { version = "=0.8.2", default-features = false, optional = true }
zcash_note_encryption = { version = "=0.4.2", optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }
sapling = { package = "zakura-sapling-crypto", version = "=1.0.0", default-features = false, optional = true }
orchard = { package = "zakura-orchard", version = "=1.0.0", default-features = false, optional = true }
bip39 = { version = "=2.2.2", default-features = false, features = ["alloc", "zeroize"], optional = true }
secrecy = { version = "=0.8.0", optional = true }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"], optional = true }
secp256k1 = { version = "=0.29.1", default-features = false, optional = true }
zcash_script = { version = "=0.4.5", default-features = false, optional = true }
zcash_transparent = { version = "=0.10.0", default-features = false, optional = true }
zcash_address = { version = "=0.13.0", optional = true }
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc4", default-features = false, optional = true }
zcash_keys = { package = "zakura-keys", version = "=1.0.0", default-features = false, optional = true }
prost = { version = "=0.14.4", optional = true }
zip32 = { version = "=0.2.1", optional = true }
serde_json = { version = "=1.0.151", optional = true }
hex = { version = "=0.4.3", optional = true }
# RC4 SQLite migration calls PCZT into_effects, gated by io-finalizer.
pczt = { package = "zakura-pczt", version = "=0.1.0-rc2", default-features = false, optional = true }
rusqlite = { version = "=0.37.0", features = ["bundled", "array"], optional = true }
zcash_client_sqlite = { package = "zakura-client-sqlite", version = "=0.1.0-rc4", default-features = false, features = ["orchard", "transparent-inputs"], optional = true }
rand_core = { version = "=0.10.1", optional = true }
getrandom = { version = "=0.4.3", features = ["sys_rng"], optional = true }
uuid = { version = "=1.26.1", optional = true }

zcash_protocol = { version = "=0.10.6", default-features = false }
wasm-bindgen = "=0.2.128"
zcash_primitives = { package = "zakura-primitives", version = "=1.0.0", default-features = false, features = ["std"] }

[dev-dependencies]
secp256k1 = { version = "=0.29.1", default-features = false }
sapling = { package = "zakura-sapling-crypto", version = "=1.0.0", default-features = false }
orchard = { package = "zakura-orchard", version = "=1.0.0", default-features = false }
zcash_note_encryption = "=0.4.2"

serde_json = "=1.0.151"
hex = "=0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Upstream finalization and fused execution call OffsetDateTime::now_utc directly.
time = { version = "=0.3.55", features = ["wasm-bindgen"], optional = true }
getrandom = { version = "=0.4.3", features = ["wasm_js"], optional = true }
uuid = { version = "=1.26.1", features = ["js"], optional = true }

# Materialized from checksum-verified locked archives by native-policy/prepare.py.
[patch.crates-io]
zakura-client-backend = { path = "native-policy/vendor/zakura-client-backend" }
zakura-client-sqlite = { path = "native-policy/vendor/zakura-client-sqlite" }
